<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MegaMix - Do Tijolo ao Pixel</title>
  <style>
    :root {
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --bg: #f1f5f9;
      --card-bg: #ffffff;
      --text-color: #0f172a;
      --bot-msg: #e2e8f0;
      --bot-text: #0f172a;
      --user-msg: #2563eb;
      --user-text: #ffffff;
      --disabled: #94a3b8;
      --border-color: #cbd5e1;
    }

    [data-theme="dark"] {
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text-color: #f8fafc;
      --bot-msg: #334155;
      --bot-text: #f8fafc;
      --user-msg: #3b82f6;
      --user-text: #ffffff;
      --disabled: #475569;
      --border-color: #334155;
    }

    [data-theme="gamer"] {
      --primary: #a855f7;
      --primary-hover: #9333ea;
      --bg: #18181b;
      --card-bg: #27272a;
      --text-color: #f4f4f5;
      --bot-msg: #3f3f46;
      --bot-text: #f4f4f5;
      --user-msg: #a855f7;
      --user-text: #ffffff;
      --disabled: #52525b;
      --border-color: #3f3f46;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background-color: var(--bg);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      transition: background-color 0.3s;
    }

    #chat-container {
      position: relative;
      width: 100%;
      max-width: 400px;
      height: 600px;
      background: var(--card-bg);
      border-radius: 16px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.15);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      transition: background-color 0.3s;
    }

    .chat-header {
      background: var(--primary);
      color: white;
      padding: 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      transition: background 0.3s;
    }

    .header-info {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .avatar {
      width: 38px;
      height: 38px;
      background: white;
      color: var(--primary);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 1.1rem;
    }

    .status { font-size: 0.8rem; opacity: 0.9; }

    .icon-btn {
      background: transparent;
      border: none;
      color: white;
      cursor: pointer;
      padding: 6px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .icon-btn:hover { background: rgba(255, 255, 255, 0.2); }

    #settings-panel {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: var(--card-bg);
      color: var(--text-color);
      z-index: 10;
      display: flex;
      flex-direction: column;
      padding: 20px;
      gap: 18px;
      transform: translateY(100%);
      transition: transform 0.3s ease-in-out;
    }

    #settings-panel.active { transform: translateY(0); }

    .settings-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 12px;
    }

    .settings-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .settings-group label {
      font-size: 0.85rem;
      font-weight: 600;
      opacity: 0.85;
    }

    .settings-group input[type="text"],
    .settings-group select {
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      background: var(--bg);
      color: var(--text-color);
      font-size: 0.9rem;
      outline: none;
    }

    .checkbox-group {
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      font-size: 0.9rem;
    }

    .btn-danger {
      background: #ef4444;
      color: white;
      border: none;
      padding: 10px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      margin-top: auto;
    }

    #chat-box {
      flex: 1;
      padding: 16px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
      scroll-behavior: smooth;
    }

    .message {
      max-width: 85%;
      padding: 10px 14px;
      border-radius: 16px;
      font-size: 0.92rem;
      line-height: 1.45;
      animation: fadeIn 0.2s ease-in;
      word-wrap: break-word;
      white-space: pre-wrap; /* Permite formatação de quebras de linha */
    }

    .bot {
      background-color: var(--bot-msg);
      color: var(--bot-text);
      align-self: flex-start;
      border-bottom-left-radius: 4px;
    }

    .user {
      background-color: var(--user-msg);
      color: var(--user-text);
      align-self: flex-end;
      border-bottom-right-radius: 4px;
    }

    .timestamp {
      font-size: 0.7rem;
      margin-top: 4px;
      opacity: 0.7;
      text-align: right;
    }

    .hide-timestamps .timestamp { display: none !important; }

    .typing {
      display: flex;
      gap: 4px;
      padding: 12px 16px;
      align-self: flex-start;
      background: var(--bot-msg);
      border-radius: 16px;
      border-bottom-left-radius: 4px;
    }

    .dot {
      width: 6px;
      height: 6px;
      background: #888;
      border-radius: 50%;
      animation: blink 1.4s infinite ease-in-out both;
    }

    .dot:nth-child(1) { animation-delay: -0.32s; }
    .dot:nth-child(2) { animation-delay: -0.16s; }

    .quick-replies {
      display: flex;
      gap: 6px;
      padding: 0 16px 12px;
      overflow-x: auto;
    }

    .chip {
      background: var(--bg);
      color: var(--primary);
      border: 1px solid var(--primary);
      padding: 6px 12px;
      border-radius: 16px;
      font-size: 0.8rem;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.2s;
    }

    .chip:hover { opacity: 0.8; }

    #input-container {
      display: flex;
      border-top: 1px solid var(--border-color);
      padding: 12px;
      background: var(--card-bg);
      gap: 8px;
    }

    #user-input {
      flex: 1;
      border: 1px solid var(--border-color);
      background: var(--bg);
      color: var(--text-color);
      border-radius: 20px;
      padding: 10px 16px;
      outline: none;
    }

    button.send-btn {
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    button:disabled { background: var(--disabled) !important; cursor: not-allowed; }

    @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes blink { 0%, 80%, 100% { transform: scale(0); } 40% { transform: scale(1); } }
  </style>
</head>
<body data-theme="default">

<div id="chat-container">
  <div class="chat-header">
    <div class="header-info">
      <div class="avatar" aria-hidden="true">🛠️</div>
      <div>
        <strong id="header-bot-name">Atendimento MegaMix</strong>
        <div class="status">● Loja Aberta</div>
      </div>
    </div>
    <button class="icon-btn" id="open-settings-btn" onclick="toggleSettings()" aria-label="Abrir configurações">
      ⚙️
    </button>
  </div>

  <div id="settings-panel">
    <div class="settings-header">
      <h3>Configurações do Chat</h3>
      <button class="icon-btn" onclick="toggleSettings()" style="color: var(--text-color);">✖</button>
    </div>

    <div class="settings-group">
      <label for="setting-bot-name">Nome do Assistente</label>
      <input type="text" id="setting-bot-name" value="Atendimento MegaMix" onchange="updateBotName(this.value)">
    </div>

    <div class="settings-group">
      <label for="setting-theme">Estilo da Loja</label>
      <select id="setting-theme" onchange="updateTheme(this.value)">
        <option value="default">Azul Padrão</option>
        <option value="dark">Modo Escuro</option>
        <option value="gamer">Neon Gamer (Roxo/Preto)</option>
      </select>
    </div>

    <div class="settings-group">
      <label for="setting-speed">Velocidade da Resposta</label>
      <select id="setting-speed" onchange="updateSpeed(this.value)">
        <option value="500">Rápida (0.5s)</option>
        <option value="1200" selected>Normal (1.2s)</option>
        <option value="2500">Lenta (2.5s)</option>
      </select>
    </div>

    <div class="checkbox-group">
      <input type="checkbox" id="setting-timestamps" checked onchange="toggleTimestamps(this.checked)">
      <label for="setting-timestamps">Exibir horário nas mensagens</label>
    </div>

    <button class="btn-danger" onclick="clearChat()">🗑️ Limpar Conversa</button>
  </div>

  <div id="chat-box" role="log">
    <div class="message bot">
      Bem-vindo à MegaMix! Temos tudo do tijolo ao pixel. Como posso te ajudar hoje?
      <div class="timestamp" id="start-time"></div>
    </div>
  </div>

  <div class="quick-replies" id="quick-replies"></div>

  <form id="input-container" onsubmit="handleFormSubmit(event)">
    <input type="text" id="user-input" placeholder="Digite sua dúvida ou escolha uma opção..." autocomplete="off">
    <button type="submit" class="send-btn" id="send-btn" aria-label="Enviar">➔</button>
  </form>
</div>

<script>
  const config = { responseDelay: 1200, showTimestamps: true };

  const menus = {
    main: [
      { label: '🏗️ Construção', value: 'Construção' },
      { label: '🕹️ Setor Gamer', value: 'Setor Gamer' },
      { label: '📍 Endereço', value: 'Endereço' },
      { label: '🕒 Horário', value: 'Horário' }
    ],
    construcao: [
      { label: '🧱 Cimento e Areia', value: 'Cimento e Areia' },
      { label: '🛠️ Ferramentas', value: 'Ferramentas' },
      { label: '🎨 Tintas', value: 'Tintas' },
      { label: '⚡ Elétrica e Hidráulica', value: 'Elétrica' },
      { label: '⬅️ Voltar ao Menu', value: 'Menu Principal' }
    ],
    gamer: [
      { label: '🖥️ PCs & Consoles', value: 'PCs e Consoles' },
      { label: '⌨️ Periféricos RGB', value: 'Periféricos RGB' },
      { label: '🎧 Headsets', value: 'Headsets' },
      { label: '🪑 Cadeiras Gamer', value: 'Cadeiras Gamer' },
      { label: '⬅️ Voltar ao Menu', value: 'Menu Principal' }
    ]
  };

  document.getElementById('start-time').textContent = getTime();
  renderQuickReplies(menus.main);

  function getTime() {
    return new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  }

  function renderQuickReplies(options) {
    const container = document.getElementById("quick-replies");
    container.innerHTML = "";
    options.forEach(opt => {
      const btn = document.createElement("button");
      btn.className = "chip";
      btn.textContent = opt.label;
      btn.onclick = () => sendQuickReply(opt.value);
      container.appendChild(btn);
    });
  }

  function toggleSettings() {
    document.getElementById("settings-panel").classList.toggle("active");
  }

  function updateBotName(newName) {
    document.getElementById("header-bot-name").textContent = newName.trim() || "Atendimento MegaMix";
  }

  function updateTheme(themeValue) {
    document.body.setAttribute("data-theme", themeValue);
  }

  function updateSpeed(speedValue) {
    config.responseDelay = parseInt(speedValue, 10);
  }

  function toggleTimestamps(show) {
    config.showTimestamps = show;
    document.getElementById("chat-box").classList.toggle("hide-timestamps", !show);
  }

  function clearChat() {
    document.getElementById("chat-box").innerHTML = `
      <div class="message bot">
        Conversa reiniciada. Como posso te ajudar hoje?
        <div class="timestamp">${getTime()}</div>
      </div>
    `;
    renderQuickReplies(menus.main);
    toggleSettings();
  }

  function handleFormSubmit(e) {
    e.preventDefault();
    sendMessage();
  }

  function sendQuickReply(text) {
    sendMessage(text);
  }

  function sendMessage(textOverride) {
    const input = document.getElementById("user-input");
    const text = textOverride || input.value.trim();

    if (!text) return;

    appendMessage(text, 'user');
    if (!textOverride) input.value = "";

    setInteractiveState(false);
    showTyping();

    setTimeout(() => {
      removeTyping();
      processBotResponse(text);
      setInteractiveState(true);
    }, config.responseDelay);
  }

  function appendMessage(text, sender) {
    const chatBox = document.getElementById("chat-box");
    const msgDiv = document.createElement("div");
    msgDiv.className = `message ${sender}`;

    msgDiv.appendChild(document.createTextNode(text));

    const timeDiv = document.createElement("div");
    timeDiv.className = "timestamp";
    timeDiv.textContent = getTime();
    msgDiv.appendChild(timeDiv);

    chatBox.appendChild(msgDiv);
    chatBox.scrollTop = chatBox.scrollHeight;
  }

  function showTyping() {
    const chatBox = document.getElementById("chat-box");
    const typingDiv = document.createElement("div");
    typingDiv.id = "typing-indicator";
    typingDiv.className = "typing";
    typingDiv.innerHTML = `<div class="dot"></div><div class="dot"></div><div class="dot"></div>`;
    chatBox.appendChild(typingDiv);
    chatBox.scrollTop = chatBox.scrollHeight;
  }

  function removeTyping() {
    const typingDiv = document.getElementById("typing-indicator");
    if (typingDiv) typingDiv.remove();
  }

  function setInteractiveState(enabled) {
    document.getElementById("user-input").disabled = !enabled;
    document.getElementById("send-btn").disabled = !enabled;
    document.getElementById("open-settings-btn").disabled = !enabled;
    document.querySelectorAll(".chip").forEach(chip => chip.disabled = !enabled);
    if (enabled) document.getElementById("user-input").focus();
  }

  function processBotResponse(text) {
    const clean = text.toLowerCase();
    let responseText = "";

    if (clean.includes("constru") || clean.includes("obra")) {
      responseText = "Entendido! O setor de Construção fica no nosso TÉRREO. Escolha uma categoria abaixo para consultar os itens disponíveis:";
      renderQuickReplies(menus.construcao);
    } 
    else if (clean.includes("gamer") || clean.includes("setup")) {
      responseText = "Show! O Setor Gamer fica no 1º ANDAR. Escolha uma das categorias abaixo para ver as opções com preços e detalhes:";
      renderQuickReplies(menus.gamer);
    } 
    else if (clean.includes("menu principal") || clean.includes("voltar")) {
      responseText = "Voltando ao menu inicial. Escolha um dos setores ou tire sua dúvida:";
      renderQuickReplies(menus.main);
    }
    /* --- ITENS DE CONSTRUÇÃO COM PREÇO E DESCRIÇÃO --- */
    else if (clean.includes("cimento") || clean.includes("areia")) {
      responseText = "🧱 ITENS DISPONÍVEIS (Setor Construção):\n\n" +
        "1. Cimento CP II 50kg\n" +
        "💰 Preço: R$ 34,90\n" +
        "📝 Descrição: Cimento de alta resistência, ideal para fundações e estruturas em geral.\n\n" +
        "2. Saco de Areia Fina 20kg\n" +
        "💰 Preço: R$ 12,00\n" +
        "📝 Descrição: Areia lavada e peneirada, perfeita para acabamentos e rebocos leves.\n\n" +
        "Qual a quantidade desejada de cada item?";
    } 
    else if (clean.includes("ferramentas")) {
      responseText = "🛠️ ITENS DISPONÍVEIS (Setor Construção):\n\n" +
        "1. Furadeira de Impacto 750W\n" +
        "💰 Preço: R$ 249,90\n" +
        "📝 Descrição: Potente para perfurações em concreto e madeira. Acompanha maleta.\n\n" +
        "2. Jogo de Chaves 40 Peças\n" +
        "💰 Preço: R$ 89,90\n" +
        "📝 Descrição: Fabricado em aço cromo vanádio com estojo organizador rígido.\n\n" +
        "Gostaria de consultar o estoque ou comprar algum desses?";
    } 
    else if (clean.includes("tintas")) {
      responseText = "🎨 ITENS DISPONÍVEIS (Setor Construção):\n\n" +
        "1. Tinta Acrílica Branca 18L\n" +
        "💰 Preço: R$ 189,00\n" +
        "📝 Descrição: Rendimento extra com excelente cobertura e acabamento fosco.\n\n" +
        "2. Tinta Spray Multiuso 400ml\n" +
        "💰 Preço: R$ 24,90\n" +
        "📝 Descrição: Secagem rápida em até 30min, indicada para metal e madeira.\n\n" +
        "Qual cor ou acabamento você procura?";
    } 
    else if (clean.includes("elétrica") || clean.includes("hidráulica")) {
      responseText = "⚡ ITENS DISPONÍVEIS (Setor Construção):\n\n" +
        "1. Rolo Cabo Flexível 2.5mm (100m)\n" +
        "💰 Preço: R$ 145,00\n" +
        "📝 Descrição: Fio antichama normatizado, ideal para tomadas residenciais.\n\n" +
        "2. Disjuntor Unipolar 20A\n" +
        "💰 Preço: R$ 18,50\n" +
        "📝 Descrição: Proteção essencial contra sobrecargas elétricas na sua rede.\n\n" +
        "Precisa de auxílio para calcular a metragem do cabo?";
    }
    /* --- ITENS GAMER COM PREÇO E DESCRIÇÃO --- */
    else if (clean.includes("pcs") || clean.includes("consoles")) {
      responseText = "🖥️ ITENS DISPONÍVEIS (Setor Gamer):\n\n" +
        "1. PC Gamer MegaMix RTX 4060\n" +
        "💰 Preço: R$ 4.899,00\n" +
        "📝 Descrição: Intel i5 13ª Geração, 16GB RAM DDR4, SSD 1TB NVMe M.2.\n\n" +
        "2. Console Next-Gen 1TB\n" +
        "💰 Preço: R$ 3.799,00\n" +
        "📝 Descrição: Gráficos em 4K nativo, SSD ultrarrápido e 1 controle sem fio incluso.\n\n" +
        "Qual dessas opções você quer adicionar ao carrinho?";
    } 
    else if (clean.includes("periféricos")) {
      responseText = "⌨️ ITENS DISPONÍVEIS (Setor Gamer):\n\n" +
        "1. Teclado Mecânico RGB Switch Blue\n" +
        "💰 Preço: R$ 229,90\n" +
        "📝 Descrição: Padrão ABNT2, iluminação RGB customizável e tecnologia anti-ghosting.\n\n" +
        "2. Mouse Gamer 12.000 DPI\n" +
        "💰 Preço: R$ 119,90\n" +
        "📝 Descrição: Sensor óptico de alta precisão com 6 botões programáveis.\n\n" +
        "Deseja escolher um teclado ou mouse?";
    } 
    else if (clean.includes("headsets")) {
      responseText = "🎧 ITENS DISPONÍVEIS (Setor Gamer):\n\n" +
        "1. Headset 7.1 Surround Wireless\n" +
        "💰 Preço: R$ 349,90\n" +
        "📝 Descrição: Conexão sem fio de baixa latência e microfone com cancelamento de ruído.\n\n" +
        "2. Headset P3 Estéreo Pro\n" +
        "💰 Preço: R$ 129,90\n" +
        "📝 Descrição: Drivers de 50mm para graves profundos e almofadas acolchoadas macias.\n\n" +
        "Prefere conexão P2/P3, USB ou Sem Fio?";
    } 
    else if (clean.includes("cadeiras")) {
      responseText = "🪑 ITENS DISPONÍVEIS (Setor Gamer):\n\n" +
        "1. Cadeira Gamer Ergonomic Pro\n" +
        "💰 Preço: R$ 899,00\n" +
        "📝 Descrição: Reclinável até 180°, estrutura reforçada de aço e almofadas lombar/cervical.\n\n" +
        "Qual cor você gostaria (Preto/Vermelho, Preto/Azul ou Toda Preta)?";
    }
    /* --- OUTRAS INFORMAÇÕES --- */
    else if (clean.includes("endereço") || clean.includes("onde")) {
      responseText = "📍 NOSSA LOJA FÍSICA:\nAv. dos Inventores, nº 1024 - Bairro NeoVila.\nTemos estacionamento gratuito no local!";
    } 
    else if (clean.includes("horário") || clean.includes("hora")) {
      responseText = "🕒 HORÁRIO DE FUNCIONAMENTO:\nSegunda a Sábado: 08h às 20h\nDomingos: 09h às 14h";
    } 
    else {
      responseText = "Não encontrei esse item exato, mas escolha uma das opções abaixo para ver a lista de produtos com preços e descrições!";
    }

    appendMessage(responseText, 'bot');
  }
</script>

</body>
</html>
