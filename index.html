<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MegaMix - Do Tijolo ao Pixel</title>
  <style>
    :root {
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --bg: #f1f5f9;
      --card-bg: #ffffff;
      --text-color: #0f172a;
      --bot-msg: #e2e8f0;
      --bot-text: #0f172a;
      --user-msg: #2563eb;
      --user-text: #ffffff;
      --disabled: #94a3b8;
      --border-color: #cbd5e1;
    }

    [data-theme="dark"] {
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text-color: #f8fafc;
      --bot-msg: #334155;
      --bot-text: #f8fafc;
      --user-msg: #3b82f6;
      --user-text: #ffffff;
      --disabled: #475569;
      --border-color: #334155;
    }

    [data-theme="gamer"] {
      --primary: #a855f7;
      --primary-hover: #9333ea;
      --bg: #18181b;
      --card-bg: #27272a;
      --text-color: #f4f4f5;
      --bot-msg: #3f3f46;
      --bot-text: #f4f4f5;
      --user-msg: #a855f7;
      --user-text: #ffffff;
      --disabled: #52525b;
      --border-color: #3f3f46;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background-color: var(--bg);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      transition: background-color 0.3s;
    }

    #chat-container {
      position: relative;
      width: 100%;
      max-width: 420px;
      height: 640px;
      background: var(--card-bg);
      border-radius: 16px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.15);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      transition: background-color 0.3s;
    }

    .chat-header {
      background: var(--primary);
      color: white;
      padding: 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      transition: background 0.3s;
    }

    .header-info {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .avatar {
      width: 38px;
      height: 38px;
      background: white;
      color: var(--primary);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 1.1rem;
    }

    .status { font-size: 0.8rem; opacity: 0.9; }

    .icon-btn {
      background: transparent;
      border: none;
      color: white;
      cursor: pointer;
      padding: 6px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .icon-btn:hover { background: rgba(255, 255, 255, 0.2); }

    #settings-panel {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: var(--card-bg);
      color: var(--text-color);
      z-index: 10;
      display: flex;
      flex-direction: column;
      padding: 20px;
      gap: 18px;
      transform: translateY(100%);
      transition: transform 0.3s ease-in-out;
    }

    #settings-panel.active { transform: translateY(0); }

    .settings-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 12px;
    }

    .settings-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .settings-group label {
      font-size: 0.85rem;
      font-weight: 600;
      opacity: 0.85;
    }

    .settings-group input[type="text"],
    .settings-group select {
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      background: var(--bg);
      color: var(--text-color);
      font-size: 0.9rem;
      outline: none;
    }

    .checkbox-group {
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      font-size: 0.9rem;
    }

    .btn-danger {
      background: #ef4444;
      color: white;
      border: none;
      padding: 10px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      margin-top: auto;
    }

    #chat-box {
      flex: 1;
      padding: 16px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
      scroll-behavior: smooth;
    }

    .message {
      max-width: 88%;
      padding: 10px 14px;
      border-radius: 16px;
      font-size: 0.92rem;
      line-height: 1.45;
      animation: fadeIn 0.2s ease-in;
      word-wrap: break-word;
      white-space: pre-wrap;
    }

    .bot {
      background-color: var(--bot-msg);
      color: var(--bot-text);
      align-self: flex-start;
      border-bottom-left-radius: 4px;
    }

    .user {
      background-color: var(--user-msg);
      color: var(--user-text);
      align-self: flex-end;
      border-bottom-right-radius: 4px;
    }

    .timestamp {
      font-size: 0.7rem;
      margin-top: 4px;
      opacity: 0.7;
      text-align: right;
    }

    .hide-timestamps .timestamp { display: none !important; }

    .typing {
      display: flex;
      gap: 4px;
      padding: 12px 16px;
      align-self: flex-start;
      background: var(--bot-msg);
      border-radius: 16px;
      border-bottom-left-radius: 4px;
    }

    .dot {
      width: 6px;
      height: 6px;
      background: #888;
      border-radius: 50%;
      animation: blink 1.4s infinite ease-in-out both;
    }

    .dot:nth-child(1) { animation-delay: -0.32s; }
    .dot:nth-child(2) { animation-delay: -0.16s; }

    .quick-replies {
      display: flex;
      gap: 6px;
      padding: 0 16px 12px;
      overflow-x: auto;
    }

    .chip {
      background: var(--bg);
      color: var(--primary);
      border: 1px solid var(--primary);
      padding: 6px 12px;
      border-radius: 16px;
      font-size: 0.8rem;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.2s;
    }

    .chip:hover { opacity: 0.8; }

    #input-container {
      display: flex;
      border-top: 1px solid var(--border-color);
      padding: 12px;
      background: var(--card-bg);
      gap: 8px;
    }

    #user-input {
      flex: 1;
      border: 1px solid var(--border-color);
      background: var(--bg);
      color: var(--text-color);
      border-radius: 20px;
      padding: 10px 16px;
      outline: none;
    }

    button.send-btn {
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    button:disabled { background: var(--disabled) !important; cursor: not-allowed; }

    @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes blink { 0%, 80%, 100% { transform: scale(0); } 40% { transform: scale(1); } }
  </style>
</head>
<body data-theme="default">

<div id="chat-container">
  <div class="chat-header">
    <div class="header-info">
      <div class="avatar" aria-hidden="true">🏢</div>
      <div>
        <strong id="header-bot-name">MegaMix Megastore</strong>
        <div class="status">● Loja Aberta</div>
      </div>
    </div>
    <button class="icon-btn" id="open-settings-btn" onclick="toggleSettings()" aria-label="Abrir configurações">
      ⚙️
    </button>
  </div>

  <div id="settings-panel">
    <div class="settings-header">
      <h3>Configurações do Chat</h3>
      <button class="icon-btn" onclick="toggleSettings()" style="color: var(--text-color);">✖</button>
    </div>

    <div class="settings-group">
      <label for="setting-bot-name">Nome do Assistente</label>
      <input type="text" id="setting-bot-name" value="MegaMix Megastore" onchange="updateBotName(this.value)">
    </div>

    <div class="settings-group">
      <label for="setting-theme">Estilo da Loja</label>
      <select id="setting-theme" onchange="updateTheme(this.value)">
        <option value="default">Azul Padrão</option>
        <option value="dark">Modo Escuro</option>
        <option value="gamer">Neon Gamer (Roxo/Preto)</option>
      </select>
    </div>

    <div class="settings-group">
      <label for="setting-speed">Velocidade da Resposta</label>
      <select id="setting-speed" onchange="updateSpeed(this.value)">
        <option value="500">Rápida (0.5s)</option>
        <option value="1200" selected>Normal (1.2s)</option>
        <option value="2500">Lenta (2.5s)</option>
      </select>
    </div>

    <div class="checkbox-group">
      <input type="checkbox" id="setting-timestamps" checked onchange="toggleTimestamps(this.checked)">
      <label for="setting-timestamps">Exibir horário nas mensagens</label>
    </div>

    <button class="btn-danger" onclick="clearChat()">🗑️ Limpar Conversa</button>
  </div>

  <div id="chat-box" role="log">
    <div class="message bot">
      Bem-vindo à MegaMix! De materiais de construção a setups gamer, automotivo e casa inteligente. O que você procura hoje?
      <div class="timestamp" id="start-time"></div>
    </div>
  </div>

  <div class="quick-replies" id="quick-replies"></div>

  <form id="input-container" onsubmit="handleFormSubmit(event)">
    <input type="text" id="user-input" placeholder="Digite sua dúvida ou escolha uma opção..." autocomplete="off">
    <button type="submit" class="send-btn" id="send-btn" aria-label="Enviar">➔</button>
  </form>
</div>

<script>
  const config = { responseDelay: 1200, showTimestamps: true };

  // Menus expandidos com novos setores
  const menus = {
    main: [
      { label: '🏗️ Construção', value: 'Construção' },
      { label: '🕹️ Setor Gamer', value: 'Setor Gamer' },
      { label: '💡 Casa & Smart', value: 'Casa e Smart' },
      { label: '🚗 Automotivo', value: 'Automotivo' },
      { label: '📍 Informações da Loja', value: 'Informações' }
    ],
    construcao: [
      { label: '🧱 Cimento e Basico', value: 'Cimento' },
      { label: '🛠️ Ferramentas', value: 'Ferramentas' },
      { label: '🎨 Tintas & Acabamento', value: 'Tintas' },
      { label: '⚡ Elétrica & Hidráulica', value: 'Elétrica' },
      { label: '⬅️ Voltar ao Menu', value: 'Menu Principal' }
    ],
    gamer: [
      { label: '🖥️ PCs & Consoles', value: 'PCs e Consoles' },
      { label: '⌨️ Periféricos RGB', value: 'Periféricos RGB' },
      { label: '🎧 Headsets & Áudio', value: 'Headsets' },
      { label: '🪑 Cadeiras & Mesas', value: 'Cadeiras Gamer' },
      { label: '⬅️ Voltar ao Menu', value: 'Menu Principal' }
    ],
    casaSmart: [
      { label: '💡 Iluminação Smart', value: 'Iluminação' },
      { label: '🔒 Segurança & Fechaduras', value: 'Segurança' },
      { label: '🤖 Robôs & Eletro', value: 'Eletro' },
      { label: '⬅️ Voltar ao Menu', value: 'Menu Principal' }
    ],
    automotivo: [
      { label: '🛞 Pneus & Rodas', value: 'Pneus' },
      { label: '🧰 Óleos & Manutenção', value: 'Manutenção' },
      { label: '🧼 Estética Automotiva', value: 'Estética Auto' },
      { label: '⬅️ Voltar ao Menu', value: 'Menu Principal' }
    ]
  };

  document.getElementById('start-time').textContent = getTime();
  renderQuickReplies(menus.main);

  function getTime() {
    return new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  }

  function renderQuickReplies(options) {
    const container = document.getElementById("quick-replies");
    container.innerHTML = "";
    options.forEach(opt => {
      const btn = document.createElement("button");
      btn.className = "chip";
      btn.textContent = opt.label;
      btn.onclick = () => sendQuickReply(opt.value);
      container.appendChild(btn);
    });
  }

  function toggleSettings() {
    document.getElementById("settings-panel").classList.toggle("active");
  }

  function updateBotName(newName) {
    document.getElementById("header-bot-name").textContent = newName.trim() || "MegaMix Megastore";
  }

  function updateTheme(themeValue) {
    document.body.setAttribute("data-theme", themeValue);
  }

  function updateSpeed(speedValue) {
    config.responseDelay = parseInt(speedValue, 10);
  }

  function toggleTimestamps(show) {
    config.showTimestamps = show;
    document.getElementById("chat-box").classList.toggle("hide-timestamps", !show);
  }

  function clearChat() {
    document.getElementById("chat-box").innerHTML = `
      <div class="message bot">
        Conversa reiniciada. Escolha um setor para começar:
        <div class="timestamp">${getTime()}</div>
      </div>
    `;
    renderQuickReplies(menus.main);
    toggleSettings();
  }

  function handleFormSubmit(e) {
    e.preventDefault();
    sendMessage();
  }

  function sendQuickReply(text) {
    sendMessage(text);
  }

  function sendMessage(textOverride) {
    const input = document.getElementById("user-input");
    const text = textOverride || input.value.trim();

    if (!text) return;

    appendMessage(text, 'user');
    if (!textOverride) input.value = "";

    setInteractiveState(false);
    showTyping();

    setTimeout(() => {
      removeTyping();
      processBotResponse(text);
      setInteractiveState(true);
    }, config.responseDelay);
  }

  function appendMessage(text, sender) {
    const chatBox = document.getElementById("chat-box");
    const msgDiv = document.createElement("div");
    msgDiv.className = `message ${sender}`;

    msgDiv.appendChild(document.createTextNode(text));

    const timeDiv = document.createElement("div");
    timeDiv.className = "timestamp";
    timeDiv.textContent = getTime();
    msgDiv.appendChild(timeDiv);

    chatBox.appendChild(msgDiv);
    chatBox.scrollTop = chatBox.scrollHeight;
  }

  function showTyping() {
    const chatBox = document.getElementById("chat-box");
    const typingDiv = document.createElement("div");
    typingDiv.id = "typing-indicator";
    typingDiv.className = "typing";
    typingDiv.innerHTML = `<div class="dot"></div><div class="dot"></div><div class="dot"></div>`;
    chatBox.appendChild(typingDiv);
    chatBox.scrollTop = chatBox.scrollHeight;
  }

  function removeTyping() {
    const typingDiv = document.getElementById("typing-indicator");
    if (typingDiv) typingDiv.remove();
  }

  function setInteractiveState(enabled) {
    document.getElementById("user-input").disabled = !enabled;
    document.getElementById("send-btn").disabled = !enabled;
    document.getElementById("open-settings-btn").disabled = !enabled;
    document.querySelectorAll(".chip").forEach(chip => chip.disabled = !enabled);
    if (enabled) document.getElementById("user-input").focus();
  }

  function processBotResponse(text) {
    const clean = text.toLowerCase();
    let responseText = "";

    // --- NAVEGAÇÃO DE MENUS ---
    if (clean.includes("constru")) {
      responseText = "🏗️ Setor de Construção (Térreo - Ala A). Escolha a categoria desejada:";
      renderQuickReplies(menus.construcao);
    } 
    else if (clean.includes("gamer")) {
      responseText = "🕹️ Setor Gamer & Tech (1º Andar). Escolha uma categoria abaixo:";
      renderQuickReplies(menus.gamer);
    } 
    else if (clean.includes("casa e smart") || clean.includes("smart")) {
      responseText = "💡 Setor Casa & Smart Home (Térreo - Ala B). O que precisa para sua casa inteligente?";
      renderQuickReplies(menus.casaSmart);
    }
    else if (clean.includes("automotivo")) {
      responseText = "🚗 Setor Automotivo & Oficina (Anexo Externa). Confira as categorias:";
      renderQuickReplies(menus.automotivo);
    }
    else if (clean.includes("menu principal") || clean.includes("voltar")) {
      responseText = "Voltando ao menu principal. Escolha uma das áreas da MegaMix:";
      renderQuickReplies(menus.main);
    }

    // --- CONSTRUÇÃO ---
    else if (clean.includes("cimento")) {
      responseText = "🧱 CONSTRUÇÃO & BÁSICO:\n\n" +
        "1. Cimento CP II 50kg Itaú\n💰 R$ 34,90\n📝 Ideal para fundações, vigas e pisos.\n\n" +
        "2. Saco de Areia Fina 20kg\n💰 R$ 12,00\n📝 Lavada e peneirada para acabamentos Finos.\n\n" +
        "3. Argamassa ACIII Cinza 20kg\n💰 R$ 29,90\n📝 Alta aderência para porcelanatos e áreas externas.\n\n" +
        "4. Tijolo Baiano 6 Furos (Milheiro)\n💰 R$ 890,00\n📝 Blocos cerâmicos para vedação e alvenaria.";
    } 
    else if (clean.includes("ferramentas")) {
      responseText = "🛠️ FERRAMENTAS & MÁQUINAS:\n\n" +
        "1. Furadeira de Impacto 750W 1/2\"\n💰 R$ 249,90\n📝 Motor potente para concreto, aço e madeira.\n\n" +
        "2. Jogo de Chaves Soquete 40 Pçs\n💰 R$ 89,90\n📝 Aço Cromo Vanádio com estojo rígido.\n\n" +
        "3. Esmerilhadeira Angular 4.1/2\" 840W\n💰 R$ 319,00\n📝 Para cortes e desbastes em metais e pedras.\n\n" +
        "4. Nível a Laser 360° Verdes\n💰 R$ 450,00\n📝 Auto-nivelamento de alta precisão para alinhamentos.";
    } 
    else if (clean.includes("tintas")) {
      responseText = "🎨 TINTAS & ACABAMENTO:\n\n" +
        "1. Tinta Acrílica Fosca Branca 18L\n💰 R$ 189,00\n📝 Alta cobertura e lavabilidade para interiores/exteriores.\n\n" +
        "2. Tinta Spray Multiuso 400ml (Cores)\n💰 R$ 24,90\n📝 Secagem rápida em 30min para madeira e metal.\n\n" +
        "3. Rolo de Lã Antigota 23cm + Bandeja\n💰 R$ 35,00\n📝 Kit completo para pintura sem respingos.\n\n" +
        "4. Selador Acrílico 18L\n💰 R$ 110,00\n📝 Uniformiza a absorção da parede antes da pintura.";
    } 
    else if (clean.includes("elétrica")) {
      responseText = "⚡ ELÉTRICA & HIDRÁULICA:\n\n" +
        "1. Rolo Cabo Flexível 2.5mm (100m)\n💰 R$ 145,00\n📝 Condutor de cobre antichama 750V.\n\n" +
        "2. Disjuntor Unipolar DIN 20A\n💰 R$ 18,50\n📝 Proteção contra sobrecarga de energia.\n\n" +
        "3. Tubo PVC Esgoto 100mm (6m)\n💰 R$ 68,00\n📝 Tubulação reforçada para esgoto sanitário.\n\n" +
        "4. Chuveiro Eletrônico 7500W Turbo\n💰 R$ 199,90\n📝 Regulagem gradual de temperatura e pressurizador.";
    }

    // --- GAMER ---
    else if (clean.includes("pcs e consoles")) {
      responseText = "🖥️ PCS & CONSOLES:\n\n" +
        "1. PC Gamer RTX 4060 + i5 13ª Gen\n💰 R$ 4.899,00\n📝 16GB RAM DDR4, SSD 1TB NVMe, Fonte 600W 80 Plus.\n\n" +
        "2. Console Next-Gen 1TB SSD\n💰 R$ 3.799,00\n📝 Resolução 4K em 120 FPS, acompanha 1 controle.\n\n" +
        "3. Notebook Gamer RTX 4050 144Hz\n💰 R$ 5.499,00\n📝 Tela IPS 15.6\", Intel i7, 16GB RAM, Teclado RGB.\n\n" +
        "4. Console Portátil OLED 64GB\n💰 R$ 2.199,00\n📝 Tela vibrante de 7 polegadas e suporte ajustável.";
    } 
    else if (clean.includes("periféricos")) {
      responseText = "⌨️ PERIFÉRICOS RGB:\n\n" +
        "1. Teclado Mecânico RGB Switch Red\n💰 R$ 229,90\n📝 Padrão ABNT2, acionamento rápido e silencioso.\n\n" +
        "2. Mouse Gamer 12.000 DPI Óptico\n💰 R$ 119,90\n📝 6 botões programáveis e peso ajustável.\n\n" +
        "3. Mousepad Extra Large 90x40cm\n💰 R$ 69,90\n📝 Borda costurada e base em borracha antiderrapante.\n\n" +
        "4. Microfone Condensador USB RGB\n💰 R$ 289,00\n📝 Filtro pop incluso, captação cardioide para streams.";
    } 
    else if (clean.includes("headsets")) {
      responseText = "🎧 HEADSETS & ÁUDIO:\n\n" +
        "1. Headset 7.1 Wireless Sem Fio\n💰 R$ 349,90\n📝 Bateria para até 30 horas e áudio espacial.\n\n" +
        "2. Headset P3 Estéreo Pro Confort\n💰 R$ 129,90\n📝 Drivers de 50mm e microfone flexível removível.\n\n" +
        "3. Caixas de Som 2.1 RGB 20W\n💰 R$ 159,90\n📝 Subwoofer dedicado para graves potentes.";
    } 
    else if (clean.includes("cadeiras gamer")) {
      responseText = "🪑 CADEIRAS & MESAS GAMER:\n\n" +
        "1. Cadeira Gamer Reclinável 180°\n💰 R$ 899,00\n📝 Apoio de braço 3D, pistão classe 4 e almofadas.\n\n" +
        "2. Cadeira Mesh Ergonômica Pro\n💰 R$ 749,00\n📝 Encosto respirável com suporte lombar dinâmico.\n\n" +
        "3. Mesa Gamer Z-Shape com LED RGB\n💰 R$ 599,00\n📝 Tampo textura fibra de carbono e suporte de copo/fone.";
    }

    // --- CASA & SMART ---
    else if (clean.includes("iluminação")) {
      responseText = "💡 ILUMINAÇÃO SMART:\n\n" +
        "1. Lâmpada Inteligente Wi-Fi RGB 10W\n💰 R$ 49,90\n📝 16 milhões de cores, compatível com Alexa e Google.\n\n" +
        "2. Fita LED Smart Wi-Fi 5m\n💰 R$ 89,90\n📝 Efeitos de luz dinâmicos sincronizados com música.\n\n" +
        "3. Luminária de Mesa Smart com Carregador Indução\n💰 R$ 179,00\n📝 Ajuste de brilho e recarga de celular sem fio.";
    }
    else if (clean.includes("segurança")) {
      responseText = "🔒 SEGURANÇA & FECHADURAS:\n\n" +
