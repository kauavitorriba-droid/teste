<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chatbot Avançado</title>
  <style>
    :root {
      --primary: #0084ff;
      --primary-hover: #006bce;
      --bg: #f0f2f5;
      --bot-msg: #e4e6eb;
      --user-msg: #0084ff;
      --disabled: #b0b3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background-color: var(--bg);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    #chat-container {
      width: 100%;
      max-width: 400px;
      height: 600px;
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.12);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .chat-header {
      background: var(--primary);
      color: white;
      padding: 16px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .avatar {
      width: 38px;
      height: 38px;
      background: white;
      color: var(--primary);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
    }

    .status { font-size: 0.8rem; opacity: 0.9; }

    #chat-box {
      flex: 1;
      padding: 16px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
      scroll-behavior: smooth;
    }

    .message {
      max-width: 80%;
      padding: 10px 14px;
      border-radius: 16px;
      font-size: 0.95rem;
      line-height: 1.4;
      animation: fadeIn 0.2s ease-in;
      word-wrap: break-word;
    }

    .bot {
      background-color: var(--bot-msg);
      color: #000;
      align-self: flex-start;
      border-bottom-left-radius: 4px;
    }

    .user {
      background-color: var(--user-msg);
      color: #fff;
      align-self: flex-end;
      border-bottom-right-radius: 4px;
    }

    .timestamp {
      font-size: 0.7rem;
      margin-top: 4px;
      opacity: 0.7;
      text-align: right;
    }

    .typing {
      display: flex;
      gap: 4px;
      padding: 12px 16px;
      align-self: flex-start;
      background: var(--bot-msg);
      border-radius: 16px;
      border-bottom-left-radius: 4px;
    }

    .dot {
      width: 6px;
      height: 6px;
      background: #65676b;
      border-radius: 50%;
      animation: blink 1.4s infinite ease-in-out both;
    }

    .dot:nth-child(1) { animation-delay: -0.32s; }
    .dot:nth-child(2) { animation-delay: -0.16s; }

    .quick-replies {
      display: flex;
      gap: 6px;
      padding: 0 16px 12px;
      overflow-x: auto;
    }

    .chip {
      background: #e7f3ff;
      color: var(--primary);
      border: 1px solid var(--primary);
      padding: 6px 12px;
      border-radius: 16px;
      font-size: 0.8rem;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.2s;
    }

    .chip:hover { background: #d0e7ff; }

    #input-container {
      display: flex;
      border-top: 1px solid #eee;
      padding: 12px;
      background: #fff;
      gap: 8px;
    }

    #user-input {
      flex: 1;
      border: 1px solid #ddd;
      border-radius: 20px;
      padding: 10px 16px;
      outline: none;
      font-size: 0.95rem;
    }

    #user-input:focus { border-color: var(--primary); }

    button.send-btn {
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s;
    }

    button.send-btn:hover { background: var(--primary-hover); }
    button:disabled { background: var(--disabled); cursor: not-allowed; }

    @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes blink { 0%, 80%, 100% { transform: scale(0); } 40% { transform: scale(1); } }
  </style>
</head>
<body>

<div id="chat-container">
  <div class="chat-header">
    <div class="avatar" aria-hidden="true">AI</div>
    <div>
      <strong>Assistente Virtual</strong>
      <div class="status">● Online</div>
    </div>
  </div>

  <div id="chat-box" role="log" aria-live="polite">
    <div class="message bot">
      Olá! Como posso te ajudar hoje?
      <div class="timestamp" id="start-time"></div>
    </div>
  </div>

  <div class="quick-replies" id="quick-replies">
    <button class="chip" onclick="sendQuickReply('Preços')">💰 Preços</button>
    <button class="chip" onclick="sendQuickReply('Horário')">🕒 Horários</button>
    <button class="chip" onclick="sendQuickReply('Contato')">📞 Contato</button>
  </div>

  <form id="input-container" onsubmit="handleFormSubmit(event)">
    <input type="text" id="user-input" placeholder="Digite uma mensagem..." autocomplete="off">
    <button type="submit" class="send-btn" id="send-btn" aria-label="Enviar mensagem">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
    </button>
  </form>
</div>

<script>
  document.getElementById('start-time').textContent = getTime();

  function getTime() {
    return new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  }

  function handleFormSubmit(e) {
    e.preventDefault();
    sendMessage();
  }

  function sendQuickReply(text) {
    sendMessage(text);
  }

  function sendMessage(textOverride) {
    const input = document.getElementById("user-input");
    const text = textOverride || input.value.trim();

    if (!text) return;

    appendMessage(text, 'user');
    if (!textOverride) input.value = "";

    setInteractiveState(false);
    showTyping();

    setTimeout(() => {
      removeTyping();
      const response = getBotResponse(text);
      appendMessage(response, 'bot');
      setInteractiveState(true);
    }, 1200);
  }

  function appendMessage(text, sender) {
    const chatBox = document.getElementById("chat-box");
    const msgDiv = document.createElement("div");
    msgDiv.className = `message ${sender}`;

    // Prevenção contra XSS
    const textNode = document.createTextNode(text);
    msgDiv.appendChild(textNode);

    const timeDiv = document.createElement("div");
    timeDiv.className = "timestamp";
    timeDiv.textContent = getTime();
    msgDiv.appendChild(timeDiv);

    chatBox.appendChild(msgDiv);
    chatBox.scrollTop = chatBox.scrollHeight;
  }

  function showTyping() {
    const chatBox = document.getElementById("chat-box");
    const typingDiv = document.createElement("div");
    typingDiv.id = "typing-indicator";
    typingDiv.className = "typing";
    typingDiv.innerHTML = `<div class="dot"></div><div class="dot"></div><div class="dot"></div>`;
    chatBox.appendChild(typingDiv);
    chatBox.scrollTop = chatBox.scrollHeight;
  }

  function removeTyping() {
    const typingDiv = document.getElementById("typing-indicator");
    if (typingDiv) typingDiv.remove();
  }

  function setInteractiveState(enabled) {
    document.getElementById("user-input").disabled = !enabled;
    document.getElementById("send-btn").disabled = !enabled;
    const chips = document.querySelectorAll(".chip");
    chips.forEach(chip => chip.disabled = !enabled);
    if (enabled) document.getElementById("user-input").focus();
  }

  function getBotResponse(text) {
    const clean = text.toLowerCase();

    if (clean.includes("oi") || clean.includes("olá") || clean.includes("bom dia")) {
      return "Olá! Tudo bem? Em que posso ser útil?";
    }
    if (clean.includes("preço") || clean.includes("preços") || clean.includes("valor")) {
      return "Nossos planos começam em R$ 49,90/mês. Deseja conhecer o plano Pro?";
    }
    if (clean.includes("horário") || clean.includes("hora")) {
      return "Atendemos de segunda a sexta, das 08h às 18h.";
    }
    if (clean.includes("contato") || clean.includes("suporte")) {
      return "Você pode falar conosco pelo e-mail: contato@empresa.com";
    }

    return "Ainda estou aprendendo! Tente clicar em uma das opções acima ou perguntar sobre preços e horários.";
  }
</script>

</body>
</html>
