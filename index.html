<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MegaMix - Megastore</title>
  <style>
    :root {
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --bg: #f1f5f9;
      --card-bg: #ffffff;
      --text-color: #0f172a;
      --bot-msg: #e2e8f0;
      --bot-text: #0f172a;
      --user-msg: #2563eb;
      --user-text: #ffffff;
      --disabled: #94a3b8;
      --border-color: #cbd5e1;
    }

    [data-theme="dark"] {
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text-color: #f8fafc;
      --bot-msg: #334155;
      --bot-text: #f8fafc;
      --user-msg: #3b82f6;
      --user-text: #ffffff;
      --disabled: #475569;
      --border-color: #334155;
    }

    [data-theme="gamer"] {
      --primary: #a855f7;
      --primary-hover: #9333ea;
      --bg: #18181b;
      --card-bg: #27272a;
      --text-color: #f4f4f5;
      --bot-msg: #3f3f46;
      --bot-text: #f4f4f5;
      --user-msg: #a855f7;
      --user-text: #ffffff;
      --disabled: #52525b;
      --border-color: #3f3f46;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background-color: var(--bg);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      transition: background-color 0.3s;
    }

    #chat-container {
      position: relative;
      width: 100%;
      max-width: 420px;
      height: 640px;
      background: var(--card-bg);
      border-radius: 16px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.15);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .chat-header {
      background: var(--primary);
      color: white;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .header-info {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .header-actions {
      display: flex;
      gap: 6px;
    }

    .avatar {
      width: 36px;
      height: 36px;
      background: white;
      color: var(--primary);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
    }

    .status { font-size: 0.75rem; opacity: 0.9; }

    .icon-btn {
      background: rgba(255, 255, 255, 0.15);
      border: none;
      color: white;
      cursor: pointer;
      padding: 6px 10px;
      border-radius: 20px;
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 0.85rem;
      font-weight: bold;
    }

    .icon-btn:hover { background: rgba(255, 255, 255, 0.3); }

    /* Painéis sobrepostos (Configurações e Carrinho) */
    .slide-panel {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: var(--card-bg);
      color: var(--text-color);
      z-index: 10;
      display: flex;
      flex-direction: column;
      padding: 20px;
      gap: 16px;
      transform: translateY(100%);
      transition: transform 0.3s ease-in-out;
    }

    .slide-panel.active { transform: translateY(0); }

    .panel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 10px;
    }

    .cart-list {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .cart-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px;
      background: var(--bg);
      border-radius: 8px;
      border: 1px solid var(--border-color);
    }

    .cart-total {
      font-size: 1.1rem;
      font-weight: bold;
      text-align: right;
      padding-top: 10px;
      border-top: 1px solid var(--border-color);
    }

    .btn-success {
      background: #10b981;
      color: white;
      border: none;
      padding: 12px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
    }

    .settings-group { display: flex; flex-direction: column; gap: 6px; }
    .settings-group label { font-size: 0.85rem; font-weight: 600; }
    .settings-group input, .settings-group select {
      padding: 10px; border-radius: 8px;
      border: 1px solid var(--border-color);
      background: var(--bg); color: var(--text-color);
    }

    #chat-box {
      flex: 1;
      padding: 16px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .message {
      max-width: 88%;
      padding: 12px 14px;
      border-radius: 16px;
      font-size: 0.9rem;
      line-height: 1.4;
      animation: fadeIn 0.2s ease-in;
    }

    .bot {
      background-color: var(--bot-msg);
      color: var(--bot-text);
      align-self: flex-start;
      border-bottom-left-radius: 4px;
    }

    .user {
      background-color: var(--user-msg);
      color: var(--user-text);
      align-self: flex-end;
      border-bottom-right-radius: 4px;
    }

    /* Cards de Produtos no Chat */
    .product-cards-container {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 8px;
    }

    .product-card {
      background: var(--card-bg);
      color: var(--text-color);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 10px 12px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.05);
    }

    .product-name { font-weight: bold; font-size: 0.9rem; }
    .product-price { color: #10b981; font-weight: bold; font-size: 0.95rem; }
    .product-desc { font-size: 0.78rem; opacity: 0.8; }

    .add-cart-btn {
      background: var(--primary);
      color: white;
      border: none;
      padding: 8px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.8rem;
      font-weight: bold;
      margin-top: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: opacity 0.2s;
    }

    .add-cart-btn:hover { opacity: 0.9; }

    .timestamp { font-size: 0.68rem; margin-top: 4px; opacity: 0.7; text-align: right; }

    .typing {
      display: flex; gap: 4px; padding: 12px 16px;
      align-self: flex-start; background: var(--bot-msg);
      border-radius: 16px; border-bottom-left-radius: 4px;
    }

    .dot { width: 6px; height: 6px; background: #888; border-radius: 50%; animation: blink 1.4s infinite ease-in-out both; }
    .dot:nth-child(1) { animation-delay: -0.32s; }
    .dot:nth-child(2) { animation-delay: -0.16s; }

    .quick-replies { display: flex; gap: 6px; padding: 0 16px 12px; overflow-x: auto; }

    .chip {
      background: var(--bg); color: var(--primary);
      border: 1px solid var(--primary); padding: 6px 12px;
      border-radius: 16px; font-size: 0.8rem; cursor: pointer; white-space: nowrap;
    }

    #input-container {
      display: flex; border-top: 1px solid var(--border-color);
      padding: 12px; background: var(--card-bg); gap: 8px;
    }

    #user-input {
      flex: 1; border: 1px solid var(--border-color); background: var(--bg);
      color: var(--text-color); border-radius: 20px; padding: 10px 16px; outline: none;
    }

    button.send-btn {
      background: var(--primary); color: white; border: none;
      border-radius: 50%; width: 40px; height: 40px; cursor: pointer;
    }

    @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes blink { 0%, 80%, 100% { transform: scale(0); } 40% { transform: scale(1); } }
  </style>
</head>
<body data-theme="default">

<div id="chat-container">
  <div class="chat-header">
    <div class="header-info">
      <div class="avatar">🏢</div>
      <div>
        <strong id="header-bot-name">MegaMix Store</strong>
        <div class="status">● On-line</div>
      </div>
    </div>
    <div class="header-actions">
      <button class="icon-btn" onclick="toggleCart()">🛒 <span id="cart-count">0</span></button>
      <button class="icon-btn" onclick="toggleSettings()">⚙️</button>
    </div>
  </div>

  <!-- Painel do Carrinho -->
  <div id="cart-panel" class="slide-panel">
    <div class="panel-header">
      <h3>Seu Carrinho</h3>
      <button class="icon-btn" onclick="toggleCart()" style="color: var(--text-color);">✖</button>
    </div>
    <div class="cart-list" id="cart-items">
      <p style="text-align: center; opacity: 0.7; margin-top: 20px;">Seu carrinho está vazio.</p>
    </div>
    <div class="cart-total" id="cart-total-price">Total: R$ 0,00</div>
    <button class="btn-success" onclick="checkout()">Checkout / Finalizar Pedido</button>
  </div>

  <!-- Painel de Configurações -->
  <div id="settings-panel" class="slide-panel">
    <div class="panel-header">
      <h3>Configurações</h3>
      <button class="icon-btn" onclick="toggleSettings()" style="color: var(--text-color);">✖</button>
    </div>
    <div class="settings-group">
      <label>Nome do Assistente</label>
      <input type="text" id="setting-bot-name" value="MegaMix Store" onchange="updateBotName(this.value)">
    </div>
    <div class="settings-group">
      <label>Tema</label>
      <select onchange="updateTheme(this.value)">
        <option value="default">Azul Padrão</option>
        <option value="dark">Modo Escuro</option>
        <option value="gamer">Neon Gamer</option>
      </select>
    </div>
    <button style="background: #ef4444; color: white; border: none; padding: 10px; border-radius: 8px; margin-top: auto;" onclick="clearChat()">🗑️ Limpar Conversa</button>
  </div>

  <!-- Caixa de Mensagens do Chat -->
  <div id="chat-box" role="log">
    <div class="message bot">
      Bem-vindo à MegaMix! Escolha um setor para visualizar os produtos disponíveis e adicionar ao seu carrinho:
      <div class="timestamp" id="start-time"></div>
    </div>
  </div>

  <div class="quick-replies" id="quick-replies"></div>

  <form id="input-container" onsubmit="handleFormSubmit(event)">
    <input type="text" id="user-input" placeholder="Digite uma dúvida ou escolha uma opção..." autocomplete="off">
    <button type="submit" class="send-btn">➔</button>
  </form>
</div>

<script>
  const config = { responseDelay: 800 };
  let cart = [];

  // Base de Dados dos Produtos por Categoria
  const catalog = {
    cimento: [
      { id: 1, name: 'Cimento CP II 50kg Itaú', price: 34.90, desc: 'Resistência ideal para fundações e lajes.' },
      { id: 2, name: 'Saco de Areia Fina 20kg', price: 12.00, desc: 'Areia lavada para reboco fino.' },
      { id: 3, name: 'Argamassa ACIII 20kg', price: 29.90, desc: 'Alta fixação para porcelanatos.' }
    ],
    ferramentas: [
      { id: 4, name: 'Furadeira de Impacto 750W', price: 249.90, desc: 'Motor potente para concreto e madeira.' },
      { id: 5, name: 'Jogo de Chaves 40 Peças', price: 89.90, desc: 'Aço Cromo Vanádio com estojo.' }
    ],
    tintas: [
      { id: 6, name: 'Tinta Acrílica Branca 18L', price: 189.00, desc: 'Rendimento extra e fácil aplicação.' },
      { id: 7, name: 'Tinta Spray Multiuso 400ml', price: 24.90, desc: 'Secagem rápida em 30 minutos.' }
    ],
    eletrica: [
      { id: 8, name: 'Cabo Flexível 2.5mm (100m)', price: 145.00, desc: 'Fio de cobre antichama normatizado.' },
      { id: 9, name: 'Disjuntor Unipolar 20A', price: 18.50, desc: 'Proteção contra surtos elétricos.' }
    ],
    pcs: [
      { id: 10, name: 'PC Gamer RTX 4060 + i5', price: 4899.00, desc: '16GB RAM, SSD 1TB NVMe M.2.' },
      { id: 11, name: 'Console Next-Gen 1TB', price: 3799.00, desc: 'Jogos em 4K nativo a 120 FPS.' }
    ],
    perifericos: [
      { id: 12, name: 'Teclado Mecânico RGB', price: 229.90, desc: 'Switch Red silencioso e preciso.' },
      { id: 13, name: 'Mouse Gamer 12.000 DPI', price: 119.90, desc: '6 botões programáveis.' }
    ],
    smart: [
      { id: 14, name: 'Lâmpada Smart Wi-Fi RGB', price: 49.90, desc: 'Controle por app e comando de voz.' },
      { id: 15, name: 'Fechadura Digital Biométrica', price: 599.00, desc: 'Abertura por digital, senha e tag.' }
    ]
  };

  const menus = {
    main: [
      { label: '🏗️ Construção', value: 'Construção' },
      { label: '🕹️ Setor Gamer', value: 'Gamer' },
      { label: '💡 Casa & Smart', value: 'Smart' }
    ],
    construcao: [
      { label: '🧱 Cimento & Areia', value: 'cimento' },
      { label: '🛠️ Ferramentas', value: 'ferramentas' },
      { label: '🎨 Tintas', value: 'tintas' },
      { label: '⚡ Elétrica', value: 'eletrica' },
      { label: '⬅️ Voltar', value: 'main' }
    ],
    gamer: [
      { label: '🖥️ PCs & Consoles', value: 'pcs' },
      { label: '⌨️ Periféricos RGB', value: 'perifericos' },
      { label: '⬅️ Voltar', value: 'main' }
    ],
    smart: [
      { label: '💡 Automação Smart', value: 'smart' },
      { label: '⬅️ Voltar', value: 'main' }
    ]
  };

  document.getElementById('start-time').textContent = getTime();
  renderQuickReplies(menus.main);

  function getTime() {
    return new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  }

  function renderQuickReplies(options) {
    const container = document.getElementById("quick-replies");
    container.innerHTML = "";
    options.forEach(opt => {
      const btn = document.createElement("button");
      btn.className = "chip";
      btn.textContent = opt.label;
      btn.onclick = () => processUserChoice(opt.value, opt.label);
      container.appendChild(btn);
    });
  }

  function toggleSettings() { document.getElementById("settings-panel").classList.toggle("active"); }
  function toggleCart() { document.getElementById("cart-panel").classList.toggle("active"); }

  function updateBotName(name) { document.getElementById("header-bot-name").textContent = name || "MegaMix Store"; }
  function updateTheme(theme) { document.body.setAttribute("data-theme", theme); }

  function clearChat() {
    document.getElementById("chat-box").innerHTML = `
      <div class="message bot">
        Conversa reiniciada. Escolha um setor:
        <div class="timestamp">${getTime()}</div>
      </div>`;
    renderQuickReplies(menus.main);
    toggleSettings();
  }

  function handleFormSubmit(e) {
    e.preventDefault();
    const input = document.getElementById("user-input");
    const text = input.value.trim();
    if (!text) return;
    appendUserMessage(text);
    input.value = "";
    showTyping();
    setTimeout(() => {
      removeTyping();
      appendBotText("Procurando itens correspondentes...");
    }, config.responseDelay);
  }

  function processUserChoice(value, label) {
    appendUserMessage(label);
    showTyping();

    setTimeout(() => {
      removeTyping();

      if (value === 'main') {
        appendBotText("Selecione o setor desejado:");
        renderQuickReplies(menus.main);
      } else if (value === 'Construção') {
        appendBotText("Setor de Construção. Escolha uma categoria:");
        renderQuickReplies(menus.construcao);
      } else if (value === 'Gamer') {
        appendBotText("Setor Gamer. Escolha uma categoria:");
        renderQuickReplies(menus.gamer);
      } else if (value === 'Smart') {
        appendBotText("Setor Casa & Smart Home:");
        renderQuickReplies(menus.smart);
      } else if (catalog[value]) {
        appendBotText(`Confira os produtos disponíveis em ${label}:`);
        renderProducts(catalog[value]);
      }
    }, config.responseDelay);
  }

  function appendUserMessage(text) {
    const chatBox = document.getElementById("chat-box");
    const msgDiv = document.createElement("div");
    msgDiv.className = "message user";
    msgDiv.textContent = text;

    const timeDiv = document.createElement("div");
    timeDiv.className = "timestamp";
    timeDiv.textContent = getTime();
    msgDiv.appendChild(timeDiv);

    chatBox.appendChild(msgDiv);
    chatBox.scrollTop = chatBox.scrollHeight;
  }

  function appendBotText(text) {
    const chatBox = document.getElementById("chat-box");
    const msgDiv = document.createElement("div");
    msgDiv.className = "message bot";
    msgDiv.textContent = text;

    const timeDiv = document.createElement("div");
    timeDiv.className = "timestamp";
    timeDiv.textContent = getTime();
    msgDiv.appendChild(timeDiv);

    chatBox.appendChild(msgDiv);
    chatBox.scrollTop = chatBox.scrollHeight;
  }

  // Renderiza produtos como CARDS INTERATIVOS com botões
  function renderProducts(productList) {
    const chatBox = document.getElementById("chat-box");
    const cardsContainer = document.createElement("div");
    cardsContainer.className = "product-cards-container";

    productList.forEach(prod => {
      const card = document.createElement("div");
      card.className = "product-card";

      card.innerHTML = `
        <div class="product-name">${prod.name}</div>
        <div class="product-price">R$ ${prod.price.toFixed(2)}</div>
        <div class="product-desc">${prod.desc}</div>
        <button class="add-cart-btn" onclick="addToCart('${prod.name}', ${prod.price})">
          🛒 Adicionar ao Carrinho
        </button>
      `;
      cardsContainer.appendChild(card);
    });

    chatBox.appendChild(cardsContainer);
    chatBox.scrollTop = chatBox.scrollHeight;
  }

  function addToCart(name, price) {
    cart.push({ name, price });
    updateCartUI();
    appendBotText(`✅ "${name}" foi adicionado ao seu carrinho!`);
  }

  function updateCartUI() {
    document.getElementById("cart-count").textContent = cart.length;
    const cartItemsDiv = document.getElementById("cart-items");
    const totalDiv = document.getElementById("cart-total-price");

    if (cart.length === 0) {
      cartItemsDiv.innerHTML = `<p style="text-align: center; opacity: 0.7; margin-top: 20px;">Seu carrinho está vazio.</p>`;
      totalDiv.textContent = "Total: R$ 0,00";
      return;
    }

    cartItemsDiv.innerHTML = "";
    let total = 0;

    cart.forEach((item, index) => {
      total += item.price;
      const div = document.createElement("div");
      div.className = "cart-item";
      div.innerHTML = `
        <div>
          <strong style="font-size: 0.85rem;">${item.name}</strong><br>
          <span style="color: #10b981; font-weight: bold;">R$ ${item.price.toFixed(2)}</span>
        </div>
        <button style="background: transparent; border: none; color: #ef4444; cursor: pointer; font-size: 1.1rem;" onclick="removeFromCart(${index})">🗑️</button>
      `;
      cartItemsDiv.appendChild(div);
    });

    totalDiv.textContent = `Total: R$ ${total.toFixed(2)}`;
  }

  function removeFromCart(index) {
    cart.splice(index, 1);
    updateCartUI();
  }

  function checkout() {
    if (cart.length === 0) {
      alert("Seu carrinho está vazio!");
      return;
    }
    alert("Pedido realizado com sucesso!");
    cart = [];
    updateCartUI();
    toggleCart();
    appendBotText("🎉 Obrigado pela compra! Seu pedido foi registrado.");
  }

  function showTyping() {
    const chatBox = document.getElementById("chat-box");
    const typingDiv = document.createElement("div");
    typingDiv.id = "typing-indicator";
    typingDiv.className = "typing";
    typingDiv.innerHTML = `<div class="dot"></div><div class="dot"></div><div class="dot"></div>`;
    chatBox.appendChild(typingDiv);
    chatBox.scrollTop = chatBox.scrollHeight;
  }

  function removeTyping() {
    const typingDiv = document.getElementById("typing-indicator");
    if (typingDiv) typingDiv.remove();
  }
</script>

</body>
</html>
